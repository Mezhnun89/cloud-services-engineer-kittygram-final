server {
    listen 80;
    server_tokens off;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin static — лежат в корне volume: /static/admin/
    location /static/admin/ {
        alias /static/admin/;
    }

    # Django REST framework static — лежат в корне volume: /static/rest_framework/
    location /static/rest_framework/ {
        alias /static/rest_framework/;
    }

    # React CRA кладёт JS/CSS в build/static/, поэтому в volume: /static/static/
    location /static/ {
        alias /static/static/;
    }

    location /media/ {
        alias /media/;
    }

    # React SPA: index.html в корне volume (/static/index.html)
    location / {
        alias /static/;
        try_files $uri $uri/ /index.html;
    }
}
