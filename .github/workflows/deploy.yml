name: Kittygram deployment
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kittygram-production
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [backend, frontend, gateway]
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
          - component: gateway
            context: nginx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kittygram_${{ matrix.component }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/kittygram_${{ matrix.component }}:latest
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: '1'
      YC_SERVICE_ACCOUNT_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_JSON }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-init
      - name: Read target exclusively from Terraform state
        run: |
          terraform -chdir=infra output -raw vm_ip | python -c 'import ipaddress,sys; print("VM_IP=" + str(ipaddress.IPv4Address(sys.stdin.read())))' >> "$GITHUB_ENV"
          echo "GATEWAY_PORT=$(terraform -chdir=infra output -raw gateway_port)" >> "$GITHUB_ENV"
          echo "APP_URL=$(terraform -chdir=infra output -raw app_url)" >> "$GITHUB_ENV"
      - name: Prepare private SSH files and application environment
        run: |
          umask 077
          : "${SSH_KEY:?Set SSH_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Verify the host key using YC console first}"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          python scripts/make_env.py
      - name: Wait for SSH and cloud-init
        run: |
          ready=false
          for attempt in $(seq 1 60); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=5 deploy@"$VM_IP" true; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@"$VM_IP" 'sudo timeout 1200 cloud-init status --wait && sudo docker compose version'
      - name: Deploy SHA-tagged images
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes .env docker-compose.production.yml scripts/remote-deploy.sh deploy@"$VM_IP":kittygram/
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@"$VM_IP" 'bash kittygram/remote-deploy.sh'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify actual URL, static assets, and course tests
        run: |
          pip install -r backend/requirements.txt requests
          python -c 'import os,yaml; assert yaml.safe_load(open("tests.yml"))["kittygram_domain"] == os.environ["APP_URL"], "Update tests.yml from terraform output app_url"'
          curl --fail --retry 20 --retry-all-errors --retry-delay 3 "$APP_URL/" -o /dev/null
          python scripts/smoke_test.py "$APP_URL"
          pytest tests/ --junitxml=verification.xml
          echo "Deployment verified: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kittygram-test-results
          path: verification.xml
          if-no-files-found: ignore
      - name: Telegram success notification
        env:
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python scripts/notify.py
      - name: Remove credentials
        if: always()
        run: rm -f .env "$RUNNER_TEMP/yc-key.json" "$HOME/.ssh/id_ed25519"
