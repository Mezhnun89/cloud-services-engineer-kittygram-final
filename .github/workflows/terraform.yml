name: Terraform infrastructure
on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation (destroy deletes the VM and its data)
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
permissions:
  contents: write
concurrency:
  group: kittygram-production
  cancel-in-progress: false
jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: '1'
      YC_SERVICE_ACCOUNT_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_JSON }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_gateway_port: ${{ vars.GATEWAY_PORT || '9000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-init
      - run: terraform -chdir=infra validate
      - name: Plan selected operation
        env:
          OPERATION: ${{ inputs.action }}
        run: |
          case "$OPERATION" in
            plan|apply) terraform -chdir=infra plan -input=false -out=operation.tfplan ;;
            destroy) terraform -chdir=infra plan -destroy -input=false -out=operation.tfplan ;;
            *) exit 1 ;;
          esac
      - name: Apply saved plan
        if: inputs.action != 'plan'
        run: terraform -chdir=infra apply -input=false operation.tfplan
      - name: Save actual VM address for the reviewer
        if: inputs.action == 'apply'
        run: |
          python -m pip install PyYAML
          app_url=$(terraform -chdir=infra output -raw app_url)
          python scripts/update_deploy_info.py "$app_url"
          echo "Kittygram URL: $app_url" >> "$GITHUB_STEP_SUMMARY"
          echo 'Next: verify SSH host key, then run Kittygram deployment.' >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests.yml
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Terraform Kittygram address'
            git push origin HEAD:main
          fi
      - name: Cleanup credentials and private plan
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-key.json" infra/operation.tfplan
