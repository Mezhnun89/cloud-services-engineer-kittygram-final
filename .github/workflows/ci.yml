name: Kittygram checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kittygram_user -d kittygram"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_DB: kittygram
      POSTGRES_USER: kittygram_user
      POSTGRES_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt flake8
      - name: PEP8
        run: flake8 backend --max-line-length=100 --exclude=backend/*/migrations --extend-ignore=E501
      - name: Backend behavior tests
        run: python backend/manage.py test cats --verbosity 2
      - name: Course repository checks
        run: pytest tests/test_files.py
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watchAll=false --runInBand
        working-directory: frontend
        env:
          CI: 'true'
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=bootstrap init -backend=false
      - run: terraform -chdir=bootstrap validate
      - name: Compose syntax and reviewer workflow copy
        run: |
          cp .env.example .env
          docker compose -f docker-compose.production.yml config --quiet
          cmp .github/workflows/deploy.yml kittygram_workflow.yml
